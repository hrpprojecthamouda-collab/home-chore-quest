name: home_chore_quest
description: "A gamified Flutter app that turns household chores into RPG-style quests with XP rewards, leveling system, and sound effects."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  audioplayers: ^6.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
